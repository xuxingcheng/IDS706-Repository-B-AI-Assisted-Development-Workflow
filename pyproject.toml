[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gold-forecast"
version = "0.1.0"
description = "Chronological GLD proxy forecasting and uncertainty comparison"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "statsmodels==0.14.5", "arch==7.2.0", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbconvert>=7,<8", "ipykernel>=6,<7"]

[project.scripts]
gold-forecast = "gold_forecast.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
